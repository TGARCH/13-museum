<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muzeum 3D</title>
</head>
<body>
    <canvas class="webgl"></canvas>
    <div class="start-panel">
        <div class="start-card">
            <h1>Muzeum 3D</h1>
            <p>Spaceruj jak po prawdziwej galerii.</p>
            <button class="start-button" type="button">Wejdź do muzeum</button>
            <div class="instructions">
                <span><strong>W A S D</strong> ruch</span>
                <span><strong>Mysz</strong> rozglądanie</span>
                <span><strong>Esc</strong> pauza</span>
            </div>
        </div>
    </div>
    <div class="walk-hint">WASD — ruch&nbsp;&nbsp; • &nbsp;&nbsp;Mysz — rozglądanie&nbsp;&nbsp; • &nbsp;&nbsp;Esc — pauza</div>
    <script type="module" src="/src/script.js"></script>
</body>
</html>
